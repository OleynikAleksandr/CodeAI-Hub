name: Repository CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture check
        run: npm run check:architecture

      - name: Lint
        run: npm run lint

      - name: Knip (dead code detection)
        run: npm run check:knip

      - name: Compile
        run: npm run compile
